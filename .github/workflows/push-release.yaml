name: Build and Upload Artifacts (Push)

on:
  push:
    branches:
      - "**"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-agent-client
          path: |
            main.js
            manifest.json
            styles.css
